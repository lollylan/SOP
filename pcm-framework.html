<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asklaion SOP</title>
<style>
@import url('https://fonts.googleapis.com/css2family=Merriweather:wght@400;700&display=swap');

:root {
  /* Praxis-CI (Default) - wird optional von config/praxis.js überschrieben */
  --rot:#C0392B;--rot-h:#FDECEA;
  --orange:#BB4E26;--org-h:#F8EAE3;
  --gruen:#1E8449;--gruen-h:#EAFAF1;
  --blau:#025669;--blau-h:#E6EFF1;
  --grau:#566573;--grau-h:#F4F6F7;
  --dunkel:#1C2833;--linie:#D5D8DC;
  --kupfer:#BB4E26;--petrol-dark:#013D4B;--petrol-light:#03758F;--warmweiss:#FDF8F5;
  --praxis-blau:#025669;--praxis-dunkel:#013D4B;
  --font-head:'Merriweather',Georgia,serif;
  --radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:var(--dunkel);background:#FAFBFC;padding:16px 10px 60px}
.page{max-width:720px;margin:0 auto}
.hidden{display:none!important}

/* HEADER (SOP-Viewer) */
.sop-header{background:white;border-radius:var(--radius);border:1px solid var(--linie);overflow:hidden;margin-bottom:10px}
.hd-top{background:var(--blau);padding:14px 18px 12px}
.hd-eye{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:3px}
.hd-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:2px}
.hd-sub{font-size:12px;color:rgba(255,255,255,.75)}
.hd-meta{display:flex;flex-wrap:wrap}
.hd-mi{padding:7px 14px;border-right:1px solid var(--linie);font-size:12px;flex:1;min-width:110px}
.hd-mi:last-child{border-right:none}
.hd-ml{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--grau);margin-bottom:1px}
.hd-mv{color:var(--dunkel);font-weight:500}
.hd-note{background:var(--blau-h);border-top:1px solid var(--linie);padding:7px 14px;font-size:12px;color:var(--blau)}
.hd-note strong{font-size:10px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:1px}

/* STEPS */
.step{background:white;border:1px solid var(--linie);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.step-hd{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:background .12s}
.step-hd:hover{background:var(--grau-h)}
.step-num{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;background:var(--blau)}
.step-title{flex:1;padding:10px 4px;font-size:13px;font-weight:600}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.b-red{background:var(--rot-h);color:var(--rot)}
.b-blue{background:var(--blau-h);color:var(--blau)}
.b-green{background:var(--gruen-h);color:var(--gruen)}
.b-orange{background:var(--org-h);color:var(--orange)}
.b-gray{background:var(--grau-h);color:var(--grau)}
.chev{margin-right:12px;color:var(--grau);font-size:11px;transition:transform .18s;flex-shrink:0}
.chev.open{transform:rotate(180deg)}
.step-body{display:none;padding:12px 14px 14px;border-top:1px solid var(--linie)}
.step-body.open{display:block}

/* BOXES */
.box{border-radius:6px;padding:9px 13px;font-size:13px;margin:7px 0}
.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.bx-blue{background:var(--blau-h);border-left:3px solid var(--blau);color:#1A3A5C}
.bx-blue .lbl{color:var(--blau)}
.bx-green{background:var(--gruen-h);border-left:3px solid var(--gruen);color:#145A32}
.bx-green .lbl{color:var(--gruen)}
.bx-red{background:var(--rot-h);border-left:3px solid var(--rot);color:#7B241C}
.bx-red .lbl{color:var(--rot)}
.bx-orange{background:var(--org-h);border-left:3px solid var(--orange);color:#784212}
.bx-orange .lbl{color:var(--orange)}
.bx-gray{background:var(--grau-h);border-left:3px solid var(--grau);color:#2C3E50}
.bx-gray .lbl{color:var(--grau)}

/* CHECKLISTE */
.checklist{border:1px solid var(--linie);border-radius:6px;overflow:hidden;margin:7px 0}
.chk{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--linie);cursor:pointer;user-select:none;font-size:13px;transition:background .1s}
.chk:last-child{border-bottom:none}
.chk:hover{background:var(--grau-h)}
.cb{width:17px;height:17px;border:1.5px solid #BDC3C7;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.cb.on{background:var(--rot);border-color:var(--rot)}
.cb.on::after{content:'';width:8px;height:5px;border-left:2px solid white;border-bottom:2px solid white;transform:rotate(-45deg) translate(1px,-1px)}
.chk-g .cb.on{background:var(--gruen);border-color:var(--gruen)}

/* DERMATOSKOPIE */
.derm-tool{border:1px solid var(--linie);border-radius:8px;background:#fff;overflow:hidden;margin:7px 0}
.derm-toolbar{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--linie);background:var(--grau-h)}
.derm-tab{flex:1;min-width:120px;border:0;border-right:1px solid var(--linie);background:transparent;padding:8px 9px;font:inherit;font-size:11px;font-weight:800;color:var(--grau);cursor:pointer}
.derm-tab:last-child{border-right:0}
.derm-tab.done{background:var(--gruen-h);color:var(--gruen)}
.derm-tab.sel{background:var(--blau);color:#fff}
.derm-panel{display:none;padding:12px 14px}
.derm-panel.sel{display:block}
.derm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.derm-card{border:1.5px solid var(--linie);border-radius:7px;background:#fff;overflow:hidden;text-align:left;font:inherit;cursor:pointer;transition:border-color .12s,background .12s}
.derm-card:hover{border-color:var(--blau)}
.derm-card.sel{border-color:var(--blau);background:var(--blau-h)}
.derm-card.warn.sel{border-color:var(--orange);background:var(--org-h)}
.derm-card.benign.sel{border-color:var(--gruen);background:var(--gruen-h)}
.derm-card-top{padding:9px 11px 5px}
.derm-card-title{font-weight:800;font-size:13px;color:var(--praxis-dunkel);line-height:1.25}
.derm-card-desc{font-size:11px;color:var(--grau);line-height:1.4;margin-top:2px}
.derm-help{border:0;background:transparent;color:var(--blau);font:inherit;font-size:11px;font-weight:700;padding:3px 11px 8px;cursor:pointer}
.derm-help-panel{display:none;border-top:1px solid var(--linie);background:#F7FBFC;padding:10px 11px}
.derm-help-panel.open{display:block}
.derm-hint{font-size:11px;color:var(--dunkel);line-height:1.5;margin-bottom:8px}
.derm-imgs{display:flex;gap:8px;flex-wrap:wrap}
.derm-fig{text-align:center}
.derm-fig img{width:92px;height:92px;object-fit:cover;border:1px solid var(--linie);border-radius:5px;display:block;cursor:zoom-in}
.derm-fig figcaption{font-size:9px;color:var(--grau);margin-top:2px;max-width:92px;line-height:1.25}
.derm-location{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.derm-bodymaps{display:flex;gap:12px;flex-wrap:wrap}
.derm-svgbox{text-align:center;font-size:10px;color:var(--grau)}
.derm-zone{cursor:pointer}
.derm-zone:hover{fill:rgba(2,86,105,.18)}
.derm-zone.sel{fill:rgba(2,86,105,.25)}
.derm-zone-label{font-weight:800;color:var(--praxis-dunkel);margin-bottom:8px;min-height:20px}
.derm-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.derm-abcd-row{display:grid;grid-template-columns:32px minmax(0,1fr) 82px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--linie)}
.derm-abcd-row:last-child{border-bottom:0}
.derm-letter{width:32px;height:32px;border-radius:50%;background:var(--blau);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.derm-small{font-size:11px;color:var(--grau);line-height:1.4}
.derm-score{font-size:12px;font-weight:800;color:var(--blau);text-align:right;padding-top:6px}
.derm-choice{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.derm-opt{display:flex;align-items:center;gap:8px;border:1px solid var(--linie);border-radius:5px;background:#fff;padding:5px 8px;font-size:12px;cursor:pointer}
.derm-opt.sel{background:var(--blau-h);border-color:#A9C7CF;color:var(--blau);font-weight:700}
.derm-dot,.derm-square{width:14px;height:14px;border:2px solid #BDC3C7;flex-shrink:0}
.derm-dot{border-radius:50%}
.derm-square{border-radius:3px}
.derm-opt.sel .derm-dot,.derm-opt.sel .derm-square{background:var(--blau);border-color:var(--blau)}
.derm-slider{width:100%;accent-color:var(--blau)}
.derm-scorebox{background:var(--blau);color:#fff;border-radius:8px;padding:12px 16px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.derm-scorebox strong{font-size:28px;line-height:1}
.derm-pill{font-size:12px;font-weight:800;border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.16)}
.derm-pill.green{background:var(--gruen-h);color:var(--gruen)}
.derm-pill.orange{background:var(--org-h);color:var(--orange)}
.derm-pill.red{background:var(--rot-h);color:var(--rot)}
.derm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.derm-actions .prim-btn{margin-top:0}
.derm-secondary{font-size:12px;font-weight:700;color:var(--dunkel);background:#fff;border:1px solid var(--linie);border-radius:6px;padding:8px 12px;cursor:pointer}
.derm-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
.derm-modal.open{display:flex}
.derm-modal-inner{max-width:92vw;max-height:92vh;text-align:center;position:relative}
.derm-modal img{max-width:100%;max-height:82vh;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.45)}
.derm-modal-caption{font-size:12px;color:#fff;opacity:.85;margin-top:8px}
.derm-modal-close{position:absolute;right:-12px;top:-12px;width:28px;height:28px;border:0;border-radius:50%;background:#fff;color:var(--dunkel);font-weight:800;cursor:pointer}
@media(max-width:560px){.derm-grid,.derm-location,.derm-form-grid{grid-template-columns:1fr}.derm-tab{min-width:50%}.derm-abcd-row{grid-template-columns:32px minmax(0,1fr)}.derm-score{grid-column:2;text-align:left;padding-top:0}}

/* ORTHOPÄDIE (Gelenkuntersuchung · Neutral-Null · Funktionstests) */
.orth-nnm{width:100%;border-collapse:collapse;margin:7px 0;font-size:12.5px}
.orth-nnm th{background:var(--blau);color:#fff;padding:6px 10px;text-align:left;font-weight:600}
.orth-nnm td{padding:6px 10px;border-bottom:1px solid var(--linie);vertical-align:top}
.orth-nnm td:first-child{font-weight:600;color:var(--praxis-dunkel)}
.orth-nnm td:nth-child(2){font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--blau);font-weight:700}
.orth-nnm tr:last-child td{border-bottom:none}
.orth-nnm td.orth-nnm-in{width:34%;padding:4px 8px}
.orth-nnm input{width:100%;min-width:88px;border:1px solid var(--linie);border-radius:5px;padding:4px 7px;font:inherit;font-size:12.5px;background:#fff;color:var(--dunkel)}
.orth-nnm input:focus{outline:none;border-color:var(--blau);box-shadow:0 0 0 2px var(--blau-h)}
.orth-nnm input:not(:placeholder-shown){font-weight:700;color:var(--praxis-dunkel);background:var(--gruen-h);border-color:#A9DFBF}
.orth-card{border:1px solid var(--linie);border-radius:8px;margin:9px 0;overflow:hidden;background:#fff}
.orth-card-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px}
.orth-name{font-weight:800;font-size:13px;color:var(--praxis-dunkel);line-height:1.3}
.orth-toggle{display:flex;gap:5px;flex-shrink:0}
.orth-tg{font-size:11px;font-weight:700;border:1px solid var(--linie);background:#fff;border-radius:5px;padding:4px 9px;cursor:pointer;color:var(--grau);transition:all .12s}
.orth-tg:hover{background:var(--grau-h)}
.orth-tg.neg.sel{background:var(--gruen-h);border-color:#A9DFBF;color:var(--gruen)}
.orth-tg.pos.sel{background:var(--rot-h);border-color:#F5B7B1;color:var(--rot)}
.orth-mean{font-size:12px;color:#7B241C;background:var(--rot-h);padding:6px 12px;border-top:1px solid var(--linie);line-height:1.5}
.orth-mean b{color:var(--rot)}
.orth-det{border-top:1px solid var(--linie)}
.orth-det>summary{cursor:pointer;padding:8px 12px;font-size:12px;font-weight:700;color:var(--blau);list-style:none;user-select:none}
.orth-det>summary::-webkit-details-marker{display:none}
.orth-det>summary::before{content:'\25B8  '}
.orth-det[open]>summary::before{content:'\25BE  '}
.orth-det>summary:hover{background:var(--grau-h)}
.orth-body{padding:2px 12px 12px}
.orth-sub{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--grau);margin:8px 0 3px}
.orth-ul{list-style:none;margin:0 0 4px}
.orth-ul li{position:relative;padding:2px 0 2px 15px;font-size:12.5px;line-height:1.5}
.orth-ul li::before{content:'\2013';position:absolute;left:2px;color:#BDC3C7}
.orth-fig{margin:9px 0 2px;text-align:center}
.orth-fig img{max-width:290px;width:100%;border:1px solid var(--linie);border-radius:8px;background:#F7FBFC;cursor:zoom-in;display:inline-block}
.orth-figcap{font-size:10px;color:var(--grau);margin-top:4px;line-height:1.35}
.orth-figcap a{color:var(--blau)}
/* Video-Platzhalter (YouTube) — Klick oeffnet die Lightbox mit dem Player */
.orth-vid{position:relative;display:inline-block;width:100%;max-width:290px;aspect-ratio:16/9;
  border:1px solid var(--linie);border-radius:8px;overflow:hidden;background:#0D1B1F center/cover no-repeat;
  cursor:pointer;padding:0}
.orth-vid::after{content:'';position:absolute;inset:0;background:rgba(1,61,75,.28);transition:background .15s}
.orth-vid:hover::after,.orth-vid:focus-visible::after{background:rgba(1,61,75,.10)}
.orth-vid-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;
  width:48px;height:34px;border-radius:8px;background:rgba(192,57,43,.92);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.orth-vid-play::before{content:'';border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent #fff;margin-left:3px}
.orth-vid:hover .orth-vid-play{background:#C0392B}
.orth-vid-lbl{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:5px 7px;
  font-size:10.5px;font-weight:700;color:#fff;text-align:left;line-height:1.3;
  background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0))}
.derm-modal-inner.is-video{width:min(92vw,900px)}
.derm-modal-video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.45)}
.derm-modal-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* SPLIT */
.split{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:7px 0}
@media(max-width:480px){.split{grid-template-columns:1fr}}
.sp-cell{border-radius:6px;padding:10px 13px;font-size:13px;border:2px solid transparent}
.sp-cell strong{display:block;margin-bottom:4px;font-size:13px}
.sp-green{background:var(--gruen-h);border-color:#A9DFBF;color:#145A32}
.sp-red{background:var(--rot-h);border-color:#F5B7B1;color:#7B241C}
.sp-orange{background:var(--org-h);border-color:#FAD7A0;color:#784212}
.sp-blue{background:var(--blau-h);border-color:#A9C7CF;color:#013D4B}

/* TABELLEN */
.tbl{width:100%;border-collapse:collapse;margin:7px 0;font-size:12px}
.tbl th{padding:6px 10px;text-align:left;font-weight:600;color:#fff}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--linie);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl-blue th{background:var(--blau)}
.tbl-green th{background:var(--gruen)}
.tbl-red th{background:var(--rot)}
.row-green td{background:var(--gruen-h)}
.row-gray td{background:var(--grau-h)}
.fw{font-weight:600}

/* INPUTS */
.form-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.form-row label{font-size:13px;color:var(--dunkel);flex-shrink:0}
input[type=number],input[type=text],input[type=date]{border:1px solid var(--linie);border-radius:5px;padding:4px 8px;font-size:13px;background:#fff;color:var(--dunkel);outline:none;transition:border .15s}
input[type=number]:focus,input[type=text]:focus,input[type=date]:focus{border-color:var(--blau)}
input[type=number]{width:64px}
input[type=date]{width:150px}
.unit-btn{font-size:12px;font-weight:600;padding:4px 10px;border:1px solid var(--linie);border-radius:4px;cursor:pointer;background:#fff;color:var(--dunkel);transition:all .12s}
.unit-btn.sel{background:var(--blau-h);color:var(--blau);border-color:#A9C7CF}
.radio-group{display:flex;gap:6px;flex-wrap:wrap}
.rbtn{font-size:12px;font-weight:600;padding:4px 11px;border:1px solid var(--linie);border-radius:4px;cursor:pointer;background:#fff;color:var(--dunkel);transition:all .12s}
.rbtn:hover{background:var(--grau-h)}
.rbtn.sel{background:var(--blau-h);color:var(--blau);border-color:#A9C7CF}
.form-section{border:1px solid var(--linie);border-radius:6px;padding:10px 12px;margin:7px 0;background:var(--grau-h)}
select{border:1px solid var(--linie);border-radius:5px;padding:4px 8px;font-size:13px;background:#fff;color:var(--dunkel);outline:none}
select:focus{border-color:var(--blau)}

/* Section heading */
.sec{font-size:12px;font-weight:700;color:var(--dunkel);margin:11px 0 5px;padding-bottom:3px;border-bottom:1.5px solid var(--linie)}

/* BULLETS */
.ul{list-style:none;margin:5px 0}
.ul li{padding:2px 0 2px 16px;position:relative;font-size:13px}
.ul li::before{content:'';position:absolute;left:3px;color:#BDC3C7}
.note{font-size:11px;color:var(--grau);font-style:italic;margin-top:4px}

/* PRIMARY BUTTON */
.prim-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff;background:var(--blau);border:none;border-radius:6px;padding:8px 16px;cursor:pointer;transition:background .15s;margin-top:8px}
.prim-btn:hover{filter:brightness(.92)}

/* OUTPUT / KOPIER-BEREICH */
.output-wrap{margin-top:10px}
.output-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--grau);margin-bottom:5px}
.output-area{width:100%;min-height:200px;border:1.5px solid var(--linie);border-radius:8px 8px 0 0;padding:12px 14px;font-size:13px;font-family:'Segoe UI',system-ui,sans-serif;line-height:1.75;background:#FDFEFE;resize:vertical;color:var(--dunkel);border-bottom:none}
.copy-bar{display:flex;align-items:center;justify-content:space-between;background:var(--dunkel);border-radius:0 0 8px 8px;padding:8px 14px}
.copy-bar-label{font-size:11px;color:rgba(255,255,255,.6)}
.copy-bar-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#fff;background:var(--blau);border:none;border-radius:5px;padding:6px 14px;cursor:pointer;transition:background .15s}
.copy-bar-btn:hover{filter:brightness(.92)}
.copy-bar-btn.ok{background:var(--gruen)}

/* DASHBOARD */
.dashboard-page{max-width:1180px;margin:0 auto;padding:16px 10px 40px}
.dashboard-header{background:var(--praxis-dunkel);border-radius:10px;padding:18px 22px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.dashboard-logo{width:50px;height:50px;background:var(--blau);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px}
.dashboard-logo-img{width:50px;height:50px;object-fit:contain;flex-shrink:0;background:#fff;border-radius:8px;padding:5px}
.dashboard-title{color:#fff;font-size:18px;font-weight:700;line-height:1.2;font-family:var(--font-head)}

<body>

<!-- Lade-Anzeige -->
<div id="pcm-loader" class="boot-card">
  <div class="spinner"></div>
  <h2>SOPs werden geladen ...</h2>
  <p>Add-ons aus dem Ordner werden eingebunden.</p>
</div>

<!-- Fehler-Bereich (bleibt sichtbar, blockiert aber nicht) -->
<div id="pcm-errors"></div>

<!-- Dashboard (wird generiert) -->
<div id="pcm-dashboard" class="dashboard-page hidden"></div>

<!-- SOP-Viewer (wird generiert) -->
<div id="pcm-viewer" class="dashboard-page hidden"></div>

<!-- 1) Manifest: welche Add-ons geladen werden -->
<script src="addons.js"></script>

<!-- 2) Die Engine -->
<script>
"use strict";
/* ====================================================================
   PCM-SOP-FRAMEWORK - Engine
   Lädt Add-ons (Weg A: selbst-registrierende .js-Dateien), rendert das
   Dashboard und die SOP-Viewer, wertet Red Flags live aus und baut den
   PVS-Textbaustein über das austauschbare PVS-Template zusammen.
   Diese Datei wird NICHT pro Praxis angepasst - nur die Add-ons.
   ==================================================================== */

/* Name des Programms - erscheint in der Titelzeile und im Dashboard-Kopf.
   Der Praxisname aus config/praxis.js steht darunter. */
const PCM_PROGRAMM = 'Asklaion SOP';

/* ---- 1. Öffentliche Registry-API (von den Add-ons aufgerufen) -------- */
window.PCM = (function () {
  const sops = [];
  let pvsTemplate = null;
  let praxis = null;
  return {
    registerSOP(def) { if (def && def.id) sops.push(def); },
    setPvsTemplate(tpl) { pvsTemplate = tpl; },
    setPraxis(p) { praxis = p; },
    _sops: () => sops,
    _pvs: () => pvsTemplate,
    _praxis: () => praxis
  };
})();

/* ---- 2. Hilfsfunktionen --------------------------------------------- */
const $ = (sel, root) => (root || document).querySelector(sel);
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
const STIL_BOX = { rot: 'bx-red', blau: 'bx-blue', gruen: 'bx-green', orange: 'bx-orange', grau: 'bx-gray' };
const STIL_TBL = { blau: 'tbl-blue', gruen: 'tbl-green', rot: 'tbl-red' };

/* ---- Globale Lightbox fuer Bilder UND Videos ------------------------
   Bilder: img[data-lightbox] (+ optional data-caption).
   Videos: [data-yt="<YouTube-ID>"] (+ optional data-caption) — ein Klick
   oeffnet den Player gross. Reagiert bewusst nur auf diese beiden
   Marker, stoert also das EKG-Modal nicht. */
(function () {
  let modal = null;
  function ensureModal() {
    if (modal) return modal;
    modal = document.createElement('div');
    modal.className = 'derm-modal';
    modal.setAttribute('data-pcm-lightbox', '');
    modal.innerHTML = '<div class="derm-modal-inner">' +
      '<button class="derm-modal-close" type="button" aria-label="Schließen">×</button>' +
      '<img alt=""><div class="derm-modal-video"></div>' +
      '<div class="derm-modal-caption"></div></div>';
    document.body.appendChild(modal);
    return modal;
  }
  /* Player entfernen statt nur verstecken — sonst laeuft der Ton weiter */
  function closeModal() {
    if (!modal) return;
    modal.classList.remove('open');
    modal.querySelector('.derm-modal-video').innerHTML = '';
  }
  function openImage(trigger) {
    const m = ensureModal();
    m.querySelector('.derm-modal-video').innerHTML = '';
    m.querySelector('.derm-modal-video').style.display = 'none';
    const img = m.querySelector('img');
    img.style.display = '';
    img.src = trigger.currentSrc || trigger.src;
    m.querySelector('.derm-modal-inner').classList.remove('is-video');
    m.querySelector('.derm-modal-caption').textContent = trigger.getAttribute('data-caption') || '';
    m.classList.add('open');
  }
  function openVideo(trigger) {
    const id = trigger.getAttribute('data-yt');
    if (!/^[\w-]{11}$/.test(id)) return;
    const m = ensureModal();
    m.querySelector('img').style.display = 'none';
    const box = m.querySelector('.derm-modal-video');
    box.style.display = '';
    /* youtube-nocookie = kein Tracking-Cookie vor dem Abspielen */
    box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
      '?autoplay=1&rel=0&modestbranding=1" title="Untersuchungsvideo" allowfullscreen ' +
      'allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>';
    m.querySelector('.derm-modal-inner').classList.add('is-video');
    const cap = trigger.getAttribute('data-caption') || '';
    m.querySelector('.derm-modal-caption').innerHTML =
      (cap ? esc(cap) + ' · ' : '') +
      '<a href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener" ' +
      'style="color:#8FD3E8">auf YouTube öffnen</a>';
    m.classList.add('open');
  }
  document.addEventListener('click', function (ev) {
    const vid = ev.target.closest('[data-yt]');
    if (vid) { ev.preventDefault(); openVideo(vid); return; }
    const trigger = ev.target.closest('img[data-lightbox]');
    if (trigger) { openImage(trigger); return; }
    if (modal && (ev.target === modal || ev.target.closest('.derm-modal-close'))) {
      closeModal();
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closeModal(); return; }
    /* Platzhalter sind role="button" — Enter/Leertaste muss sie ausloesen */
    if (ev.key === 'Enter' || ev.key === ' ') {
      const vid = ev.target && ev.target.closest && ev.target.closest('[data-yt]');
      if (vid) { ev.preventDefault(); openVideo(vid); }
    }
  });
})();

/* Sammelt Lade-/Laufzeitfehler und zeigt sie verständlich an */
const bootErrors = [];
window.addEventListener('error', function (ev) {
  // Syntaxfehler in einem nachgeladenen Add-on landen hier
  if (ev && ev.filename && /\.js($|\\?)/.test(ev.filename)) {
    const datei = ev.filename.split('/').slice(-2).join('/');
    bootErrors.push('Fehler in ' + datei + ': ' + (ev.message || 'Skriptfehler') +
      (ev.lineno ? ' (Zeile ' + ev.lineno + ')' : ''));
    renderErrors();
  }
});

/* ---- 3. Add-on-Loader (dynamische <script>-Tags, file://-tauglich) --- */
function loadScript(src) {
  return new Promise(function (resolve) {
    const s = document.createElement('script');
    s.src = src;
    s.onload = function () { resolve({ src: src, ok: true }); };
    s.onerror = function () { resolve({ src: src, ok: false }); };
    document.head.appendChild(s);
  });
}

document.addEventListener('DOMContentLoaded', boot);

async function boot() {
  const manifest = window.PCM_ADDONS;
  if (!manifest) {
    showFatal('Die Datei <code>addons.js</code> wurde nicht gefunden (oder enthält kein <code>window.PCM_ADDONS</code>). ' +
      'Sie muss im selben Ordner wie diese HTML-Datei liegen.');
    return;
  }

  // Reihenfolge: erst Praxis-Branding & PVS-Template, dann die SOPs
  const files = [];
  if (manifest.praxis) files.push(manifest.praxis);
  if (manifest.pvsTemplate) files.push(manifest.pvsTemplate);
  (manifest.sops || []).forEach(function (f) { files.push(f); });

  const results = await Promise.all(files.map(loadScript));
  results.filter(function (r) { return !r.ok; }).forEach(function (r) {
    bootErrors.push('Datei nicht gefunden oder nicht ladbar: ' + r.src);
  });

  if (!PCM._pvs()) {
    bootErrors.push('Kein PVS-Textbaustein-Format geladen. Bitte ' +
      (manifest.pvsTemplate || 'config/pvs-template.js') + ' prüfen.');
  }
  const erwartet = (manifest.sops || []).length;
  const geladen = PCM._sops().length;
  if (geladen < erwartet) {
    bootErrors.push('Nur ' + geladen + ' von ' + erwartet + ' SOP-Add-ons geladen. ' +
      'Mögliche Ursache: Tippfehler im Dateinamen in addons.js oder ein Fehler in der SOP-Datei.');
  }

  applyPraxis();
  renderErrors();
  $('#pcm-loader').classList.add('hidden');

  if (geladen === 0) {
    showFatal('Es wurde keine einzige SOP geladen. Bitte die Einträge unter <code>sops:</code> in ' +
      '<code>addons.js</code> sowie die Dateien im Ordner <code>sops/</code> prüfen.');
    return;
  }
  renderDashboard();
}

/* ---- 4. Fehleranzeige ----------------------------------------------- */
function renderErrors() {
  const box = $('#pcm-errors');
  if (!box) return;
  if (!bootErrors.length) { box.innerHTML = ''; return; }
  box.innerHTML =
    '<div class="err-panel"><h3>Hinweise beim Laden der Add-ons</h3><ul>' +
    bootErrors.map(function (e) { return '<li>' + e + '</li>'; }).join('') +
    '</ul><div class="hint">Geladene SOPs funktionieren normal. ' +
    'Beim öffnen per Doppelklick zeigen manche Browser zusätzliche Details in der Entwicklerkonsole (F12).</div></div>';
}
function showFatal(htmlMsg) {
  $('#pcm-loader').classList.add('hidden');
  const box = $('#pcm-errors');
  box.innerHTML = '<div class="err-panel"><h3>SOP-Framework konnte nicht starten</h3>' +
    '<p style="font-size:13px;color:#7B241C">' + htmlMsg + '</p></div>';
}

/* ---- 5. Praxis-Branding -------------------------------------------- */
function applyPraxis() {
  const p = PCM._praxis() || {};
  if (p.farben && typeof p.farben === 'object') {
    const root = document.documentElement;
    if (p.farben.primaer) { root.style.setProperty('--blau', p.farben.primaer); root.style.setProperty('--praxis-blau', p.farben.primaer); }
    if (p.farben.primaerDunkel) root.style.setProperty('--praxis-dunkel', p.farben.primaerDunkel);
    if (p.farben.akzent) root.style.setProperty('--kupfer', p.farben.akzent);
  }
  document.title = PCM_PROGRAMM + (p.name ? ' · ' + p.name : '');
}

/* ---- 6. Dashboard --------------------------------------------------- */
function renderDashboard() {
  const p = PCM._praxis() || {};
  const dash = $('#pcm-dashboard');
  $('#pcm-viewer').classList.add('hidden');
  dash.classList.remove('hidden');

  const logoHtml = p.logo ? '<img class="dashboard-logo-img" src="' + esc(p.logo) + '" alt="">'
    : '<div class="dashboard-logo">+</div>';

  // nach Kategorie gruppieren (Reihenfolge nach erstem Auftreten)
  const sops = PCM._sops();
  const gruppen = [];
  const idx = {};
  sops.forEach(function (s) {
    const k = s.kategorie || 'SOPs';
    if (!(k in idx)) { idx[k] = gruppen.length; gruppen.push({ name: k, items: [] }); }
    gruppen[idx[k]].items.push(s);
  });

  let html =
    '<div class="dashboard-header">' + logoHtml +
    '<div><div class="dashboard-title">' + esc(p.name || 'Praxis-SOPs') + '</div>' +
    '<div class="dashboard-sub">' + esc(p.untertitel || 'Strukturierte Handlungsanweisungen für die MFA-/PCM-/VERAH-Sprechstunde') + '</div></div></div>';

  gruppen.forEach(function (g) {
    html += '<div class="dash-section-label">' + esc(g.name) + '</div><div class="sop-grid">';
    g.items.forEach(function (s) {
      html +=
        '<button class="sop-card" data-open="' + esc(s.id) + '">' +
        '<div class="sop-card-accent" style="background:' + esc(s.farbe || 'var(--blau)') + '"></div>' +
        '<div class="sop-card-icon">' + esc(s.icon || '*') + '</div>' +
        '<div class="sop-card-title">' + esc(s.titel || s.id) + '</div>' +
        '<div class="sop-card-sub">' + esc(s.untertitel || '') + '</div>' +
        '<div class="sop-card-badge">Aktiv' + (s.version ? ' · v' + esc(s.version) : '') + '</div>' +
        '</button>';
    });
    html += '</div>';
  });

  html += footerHtml(p);
  dash.innerHTML = html;
  dash.querySelectorAll('.sop-card').forEach(function (btn) {
    btn.addEventListener('click', function () { openSOP(btn.getAttribute('data-open')); });
  });
  window.scrollTo(0, 0);
}

const PCM_BEREICHE = [
  { key: 'Startseite', titel: 'Startseite', sub: 'Über dieses Programm · Bildnachweise' },
  { key: 'Telefontriage', titel: 'Telefontriage', sub: 'Erstkontakt, Notfallzeichen' },
  { key: 'PCM-Sprechstunde', titel: 'PCM-Sprechstunde', sub: 'Akutsprechstunde und SOPs' },
  { key: 'HitzeMedikation', titel: 'Hitze-Medikation', sub: 'CALOR-Liste · Medikamentenanpassung' },
  { key: 'Patientenaufklaerungen', titel: 'Patientenaufklärungen', sub: 'Deximed-Links für Beratung' },
  { key: 'Dermatologie', titel: 'Dermatologie', sub: 'Effloreszenzen, Dermatoskopie und PVS-Doku' },
  { key: 'Sonographie', titel: 'Sonographie', sub: 'Ultraschallbefund (SN) und PVS-Doku' },
  { key: 'Orthopädie', titel: 'Orthopädie', sub: 'Gelenkuntersuchung · Neutral-Null · Funktionstests' },
  { key: 'EKG', titel: 'EKG', sub: 'EKG-Befundung (EK) und PVS-Doku' },
  { key: 'Scores', titel: 'Scores', sub: 'Rechner und Dokumentation' }
];
const PCM_ROLLEN = ['Arzt', 'PCM', 'VERAH', 'MFA', 'Medizinstudent'];
const PCM_UNTERBEREICHE = ['Akutanlaesse', 'Chroniker'];

  'Dermatologie / Allergologie',
  'Augenheilkunde',
  'HNO',
  'Orthopädie',
  'Urologie',
  'Gastroenterologie',
  'Kardiologie',
  'Diabetologie',
  'Pneumologie',
  'Neurologie',
  'Psychiatrie',
  'Sonstige'
];
const SCORE_UNTERBEREICHE = [
  'Infektiologie',
  'Kardiologie',
  'Schlafmedizin',
  'Psychiatrie / Sucht',
  'Nephrologie',
  'Neurologie',
  'Hepatologie',
  'Angiologie / Pneumologie',
  'Osteologie',
  'HNO',
  'Urologie',
  'Unfallchirurgie'
];
const PATIENTEN_FACHBEREICHE = [
  'Allergologie',
  'Augenheilkunde',
  'Dermatologie',
  'Gastroenterologie',
  'Geriatrie',
  'HNO',
  'Infektiologie',
  'Kardiologie / Gefäße',
  'Lunge / Atemwege',
  'Neurologie',
  'Niere / Harnwege',
  'Orthopädie',
  'Psychiatrie / Schlaf',
  'Stoffwechsel / Endokrinologie',
  'Suchtmedizin',
  'Urologie / Männergesundheit',
  'Palliativmedizin'
];
let aktiverBereich = 'Startseite';
let aktiveRolle = (function () {
  try {
    return localStorage.getItem('pcm_rolle') || 'PCM';
  } catch (e) {
    return 'PCM';
  }
})();

function rollenOptionenHtml() {
  return PCM_ROLLEN.map(function (rolle) {
    return '<option value="' + esc(rolle) + '"' + (rolle === aktiveRolle ? ' selected' : '') + '>' + esc(rolle) + '</option>';
  }).join('');
}

function saveAktiveRolle(rolle) {
  aktiveRolle = PCM_ROLLEN.indexOf(rolle) === -1 ? 'PCM' : rolle;
  try { localStorage.setItem('pcm_rolle', aktiveRolle); } catch (e) {}
  if (aktiveSOP) {
    state.__rolle = aktiveRolle;
    refresh();
  }
}

function sopBereich(s) {
  if (s.bereich) return s.bereich;
  if (s.kategorie === 'Scores') return 'Scores';
  if (s.kategorie === 'Telefontriage') return 'Telefontriage';
  return 'PCM-Sprechstunde';
}

function sopUnterbereich(s) {
  if (s.unterbereich) return s.unterbereich;
  if (sopBereich(s) === 'PCM-Sprechstunde') return 'Akutanlaesse';
  return '';
}

function sopFachbereich(s) {
  if (s.fachbereich) return s.fachbereich;
  if (s.kategorie && s.kategorie !== 'Scores' && s.kategorie !== 'Telefontriage') return s.kategorie;
  return 'Sonstige';
}

  return {
    Akutanlaesse: '🚑 Akutanlässe',
    Chroniker: '📋 Chroniker',
    Infektiologie: '🦠 Infektiologie',
    Kardiologie: '❤️ Kardiologie',
    Schlafmedizin: '😴 Schlafmedizin',
    'Psychiatrie / Sucht': '🧠 Psychiatrie / Sucht',
    Nephrologie: '🫘 Nephrologie',
    Neurologie: '⚡ Neurologie',
    Hepatologie: '🫀 Hepatologie',
    'Angiologie / Pneumologie': '🫁 Angiologie / Pneumologie',
    Osteologie: '🦴 Osteologie',
    HNO: '👂 HNO',
    Urologie: '💧 Urologie',
    Unfallchirurgie: '🔩 Unfallchirurgie',
    Allergologie: '🌿 Allergologie',
    Dermatologie: '🩹 Dermatologie',
    Geriatrie: '🧓 Geriatrie',
    'Kardiologie / Gefäße': '❤️ Kardiologie / Gefäße',
    'Lunge / Atemwege': '🫁 Lunge / Atemwege',
    'Niere / Harnwege': '🫘 Niere / Harnwege',
    'Psychiatrie / Schlaf': '🧠 Psychiatrie / Schlaf',
    'Stoffwechsel / Endokrinologie': '🩸 Stoffwechsel / Endokrinologie',
    Suchtmedizin: '🚭 Suchtmedizin',
    'Urologie / Männergesundheit': '💧 Urologie / Männergesundheit',
    Palliativmedizin: '🤝 Palliativmedizin',
    'Dermatologie / Allergologie': '🌿 Dermatologie / Allergologie',
    Augenheilkunde: '👁️ Augenheilkunde',
    'Orthopädie': '🦴 Orthopädie',
    Gastroenterologie: '🍽️ Gastroenterologie',
    Diabetologie: '🩸 Diabetologie',
    Pneumologie: '🫁 Pneumologie',
    Psychiatrie: '🧠 Psychiatrie',
    Sonstige: '🧰 Sonstige'
  }[key] || key || 'Thema';
}

function itemButtonHtml(s) {
  if (s.link) {
    return '<a class="item-btn" href="' + esc(s.link) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="item-title">' + esc(s.titel || s.id) + '</span>' +
      '<span class="item-sub">' + esc(s.untertitel || s.kategorie || '') + '</span></a>';
  }
  return '<button class="item-btn" data-open="' + esc(s.id) + '">' +
    '<span class="item-title">' + esc(s.titel || s.id) + '</span>' +
    '<span class="item-sub">' + esc(s.untertitel || s.kategorie || '') + '</span></button>';
}

function renderToggleGroupHtml(groupId, title, bodyHtml, open) {
  return '<button class="item-group-label item-group-toggle' + (open ? ' open' : '') + '" type="button" data-group-toggle="' + esc(groupId) + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
    '<span>' + esc(title) + '</span><span class="group-chev">v</span></button>' +
    '<div class="item-group-items' + (open ? '' : ' closed') + '" data-group-body="' + esc(groupId) + '">' + bodyHtml + '</div>';
}

function uniqueValues(items, fn) {
  const out = [];
  items.forEach(function (item) {
    const val = fn(item);
    if (out.indexOf(val) === -1) out.push(val);
  });
  return out;
}

function renderDashboard(bereich) {
  const p = PCM._praxis() || {};
  const dash = $('#pcm-dashboard');
  const viewer = $('#pcm-viewer');
  if (viewer) viewer.classList.add('hidden');
  dash.classList.remove('hidden');
  aktiverBereich = bereich || aktiverBereich || 'Startseite';

  const logoHtml = p.logo ? '<img class="dashboard-logo-img" src="' + esc(p.logo) + '" alt="">'
    : '<div class="dashboard-logo">+</div>';

  const sops = PCM._sops();
  const bereiche = PCM_BEREICHE.filter(function (b) {
    return sops.some(function (s) { return sopBereich(s) === b.key; });
  });
  if (!bereiche.some(function (b) { return b.key === aktiverBereich; }) && bereiche.length) aktiverBereich = bereiche[0].key;
  const items = sops.filter(function (s) { return sopBereich(s) === aktiverBereich; });

  // Kopfzeile: Programmname oben, darunter die Praxis aus config/praxis.js
  const kopfSub = [p.name, p.untertitel].filter(Boolean).join(' · ') ||
    'Interaktive SOPs, Red-Flag-Hinweise und PVS-Dokumentation';

  let html =
    '<div class="dashboard-header">' + logoHtml +
    '<div><div class="dashboard-title">' + esc(PCM_PROGRAMM) + '</div>' +
    '<div class="dashboard-sub">' + esc(kopfSub) + '</div></div></div>' +
    '<div class="app-shell">' +
    '<div class="nav-col"><div class="nav-panel"><div class="nav-head">Bereich</div>';

  bereiche.forEach(function (b) {
    html += '<button class="area-btn' + (b.key === aktiverBereich ? ' sel' : '') + '" data-area="' + esc(b.key) + '">' +
      '<span class="area-title">' + esc(b.titel) + '</span><span class="area-sub">' + esc(b.sub) + '</span></button>';
  });

  html += '<div class="nav-tools">' +
    '<label class="role-field"><span>Rolle</span><select class="role-select" id="pcm-role-select">' + rollenOptionenHtml() + '</select></label>' +
    '<button class="nav-reset" id="pcm-nav-reset" type="button">Zurücksetzen</button></div>' +
    '</div></div><div class="list-col"><div class="list-panel"><div class="list-head">Thema</div>';
  if (items.length) {
    if (aktiverBereich === 'PCM-Sprechstunde') {
      const hauptfolge = PCM_UNTERBEREICHE.concat(uniqueValues(items, sopUnterbereich).filter(function (g) {
        return PCM_UNTERBEREICHE.indexOf(g) === -1;
      }));
      hauptfolge.forEach(function (haupt, hi) {
        const hauptItems = items.filter(function (s) { return sopUnterbereich(s) === haupt; });
        if (!hauptItems.length) return;
        html += '<div class="item-main-label">' + esc(unterbereichTitel(haupt)) + '</div><div class="item-nested">';
        const fachfolge = PCM_FACHBEREICHE.concat(uniqueValues(hauptItems, sopFachbereich).filter(function (f) {
          return PCM_FACHBEREICHE.indexOf(f) === -1;
        }));
        fachfolge.forEach(function (fach, fi) {
          const fachItems = hauptItems.filter(function (s) { return sopFachbereich(s) === fach; });
          if (!fachItems.length) return;
          let bodyHtml = '';
          fachItems.forEach(function (s) { bodyHtml += itemButtonHtml(s); });
          html += renderToggleGroupHtml('pcm-' + hi + '-' + fi, unterbereichTitel(fach), bodyHtml, false);
        });
        html += '</div>';
      });
    } else if (aktiverBereich === 'Patientenaufklaerungen') {
      const fachfolge = PATIENTEN_FACHBEREICHE.concat(uniqueValues(items, sopFachbereich).filter(function (f) {
        return PATIENTEN_FACHBEREICHE.indexOf(f) === -1;
      }));
      fachfolge.forEach(function (fach, fi) {
        const fachItems = items.filter(function (s) { return sopFachbereich(s) === fach; });
        if (!fachItems.length) return;
        let bodyHtml = '';
        fachItems.forEach(function (s) { bodyHtml += itemButtonHtml(s); });
        html += renderToggleGroupHtml('pat-' + fi, unterbereichTitel(fach), bodyHtml, false);
      });
    } else if (aktiverBereich === 'Scores') {
      SCORE_UNTERBEREICHE.forEach(function (gruppe, gi) {
        const gruppenItems = items.filter(function (s) { return sopUnterbereich(s) === gruppe; });
        if (!gruppenItems.length) return;
        let bodyHtml = '';
        gruppenItems.forEach(function (s) { bodyHtml += itemButtonHtml(s); });
        html += renderToggleGroupHtml('grp-' + gi, unterbereichTitel(gruppe), bodyHtml, false);
      });
      const sonstigeItems = items.filter(function (s) { return SCORE_UNTERBEREICHE.indexOf(sopUnterbereich(s)) === -1; });
      if (sonstigeItems.length) {
        let bodyHtml = '';
        sonstigeItems.forEach(function (s) { bodyHtml += itemButtonHtml(s); });
        html += renderToggleGroupHtml('grp-sonstige', unterbereichTitel('Sonstige'), bodyHtml, false);
      }
    } else {
      items.forEach(function (s) {
        html += itemButtonHtml(s);
      });
    }
  } else {
    html += '<div class="item-sub" style="padding:14px">Noch keine Add-ons in diesem Bereich.</div>';
  }

  html += '</div></div><div class="work-col" id="pcm-workspace">' +
    '<div class="work-empty"><strong>Thema auswählen</strong>Links einen Bereich und ein Thema öffnen.</div>' +
    '</div></div>' + footerHtml(p);

  dash.innerHTML = html;
  dash.querySelectorAll('[data-area]').forEach(function (btn) {
    btn.addEventListener('click', function () { renderDashboard(btn.getAttribute('data-area')); });
  });
  dash.querySelectorAll('[data-open]').forEach(function (btn) {
    btn.addEventListener('click', function () { openSOP(btn.getAttribute('data-open')); });
  });
  dash.querySelectorAll('[data-group-toggle]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const id = btn.getAttribute('data-group-toggle');
      const body = dash.querySelector('[data-group-body="' + id + '"]');
      if (!body) return;
      const open = body.classList.toggle('closed') === false;
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
  const resetBtn = $('#pcm-nav-reset', dash);
  if (resetBtn) resetBtn.addEventListener('click', resetAktiveSOP);
  const roleSelect = $('#pcm-role-select', dash);
  if (roleSelect) roleSelect.addEventListener('change', function () { saveAktiveRolle(roleSelect.value); });

  if (items.length && !items[0].link && (items.length === 1 || aktiverBereich === 'Telefontriage')) openSOP(items[0].id, true);
  window.scrollTo(0, 0);
}

function footerHtml(p) {
  if (!p.footer) return '';
  const brand = p.footerBrand || 'Asklaion';
  const brandHtml = p.footerLink ? '<a class="pf-name" href="' + esc(p.footerLink) + '" target="_blank" rel="noopener noreferrer">' + esc(brand) + '</a>'
    : '<span class="pf-name">' + esc(brand) + '</span>';
  return '<div class="praxis-footer">' + brandHtml + '<br>' + esc(p.footer) + '</div>';
}

/* ---- 7. SOP-Viewer -------------------------------------------------- */
let aktiveSOP = null;
let state = {};

function openSOP(id, silent) {
  const def = PCM._sops().find(function (s) { return s.id === id; });
  if (!def) return;
  aktiveSOP = def;
  aktiverBereich = sopBereich(def);
  state = initState(def);
  state.__rolle = aktiveRolle;
  document.querySelectorAll('[data-open]').forEach(function (btn) {
    btn.classList.toggle('sel', btn.getAttribute('data-open') === id);
  });
  renderViewer(def);
  const dash = $('#pcm-dashboard');
  const viewer = $('#pcm-viewer');
  if (dash) dash.classList.remove('hidden');
  if (viewer) viewer.classList.add('hidden');
  if (!silent) {
    const target = $('#pcm-workspace') || $('#pcm-dashboard');
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
function closeSOP() {
  aktiveSOP = null;
  const w = $('#pcm-workspace');
  if (w) {
    w.innerHTML = '<div class="work-empty"><strong>Thema auswählen</strong>Links einen Bereich und ein Thema öffnen.</div>';
  } else {
    renderDashboard(aktiverBereich);
  }
}

function resetAktiveSOP() {
  if (!aktiveSOP) return;
  state = initState(aktiveSOP);
  state.__rolle = aktiveRolle;
  renderViewer(aktiveSOP);
}

function initState(def) {
  const st = {};
  (def.schritte || []).forEach(function (sc) {
    (sc.elemente || []).forEach(function (el) {
      if (!el.id) return;
      if (el.typ === 'checkliste' || el.typ === 'icd') st[el.id] = [];
      else if (el.typ === 'auswahl') st[el.id] = null;
      else if (el.typ === 'zahl') st[el.id] = { wert: '', einheit: (el.einheiten && el.einheiten[0]) || '' };
      else if (el.typ === 'text' || el.typ === 'textarea') st[el.id] = '';
    });
  });
  if (def.initialState) Object.assign(st, JSON.parse(JSON.stringify(def.initialState)));
  return st;
}

/* Reine Info-Seiten (Startseite, Platzhalter) liefern keinen PVS-Text */
function hatBaustein(def) {
  return !!def && typeof def.baustein === 'function';
}

function renderViewer(def) {
  const v = $('#pcm-workspace') || $('#pcm-viewer');
  let html =
    '' +
    '<div class="rf-banner hidden" id="pcm-rf-banner"><span class="rf-ico">!</span>' +
    '<div><div class="rf-h">Red Flag - Arzt hinzuziehen</div>' +
    '<div class="rf-text" id="pcm-rf-text">Kein eigenständiges PCM/VERAH/MFA-Management.</div></div></div>' +
    '<div class="meld-panel" id="pcm-meld"></div>' +
    '<div class="sop-embed"><div class="page">' + headerHtml(def);

  (def.schritte || []).forEach(function (sc, i) {
    html += stepHtml(sc, i);
  });

  // Baustein-Bereich - entfaellt bei SOPs ohne PVS-Text (z. B. Startseite)
  if (hatBaustein(def)) {
    html +=
      '<div class="step"><div class="step-hd" data-step-toggle="out">' +
      '<div class="step-num" style="background:' + esc(def.farbe || 'var(--blau)') + '">*</div>' +
      '<div class="step-title">PVS-Dokumentation</div>' +
      '<span class="badge b-gray">Dokumentation</span>' +
      '<div class="chev open" data-chev="out">v</div></div>' +
      '<div class="step-body open" data-body="out">' +
      '<button class="prim-btn" id="pcm-gen" style="background:' + esc(def.farbe || 'var(--blau)') + '">' +
      '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>' +
      ' PVS-Dokumentation aktualisieren</button>' +
      '<div id="pcm-out" class="output-wrap hidden">' +
      '<div class="output-label">PVS-Dokumentation</div>' +
      '<textarea id="pcm-out-text" class="output-area" readonly></textarea>' +
      '<div class="copy-bar"><span class="copy-bar-label">Kopieren - ins PVS einfügen</span>' +
      '<button class="copy-bar-btn" id="pcm-copy"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Alles kopieren</button></div>' +
      '</div></div></div>';
  }

  // Fussnote (z. B. Bildnachweis) - kleingedruckt ganz unten
  if (def.fussnote) html += '<div class="sop-fussnote">' + def.fussnote + '</div>';

  html += '</div></div>'; // page, sop-embed
  v.innerHTML = html;
  wireViewer(def);
  refresh();
}

function headerHtml(def) {
  const farbe = def.farbe || 'var(--blau)';
  let meta = '';
  const metaItems = [];
  if (def.leitlinie) metaItems.push(['Leitlinie', def.leitlinie]);
  if (def.version) metaItems.push(['Version', def.version]);
  if (def.stand) metaItems.push(['Stand', def.stand]);
  if (metaItems.length) {
    meta = '<div class="hd-meta">' + metaItems.map(function (m) {
      return '<div class="hd-mi"><div class="hd-ml">' + esc(m[0]) + '</div><div class="hd-mv">' + esc(m[1]) + '</div></div>';
    }).join('') + '</div>';
  }
  const note = def.delegationshinweis ? '<div class="hd-note" style="background:#F5EEF8;color:' + esc(farbe) + ';border-color:#D7BDE2">' +
      '<strong>Hinweis · Delegation</strong>' + esc(def.delegationshinweis) + '</div>'
    : '';
  return '<div class="sop-header"><div class="hd-top" style="background:' + esc(farbe) + '">' +
    '<div class="hd-eye">' + esc(PCM_PROGRAMM) + ' · ' + esc(sopBereich(def)) + '</div>' +
    '<div class="hd-title">' + esc(def.titel || def.id) + '</div>' +
    (def.untertitel ? '<div class="hd-sub">' + esc(def.untertitel) + '</div>' : '') +
    '</div>' + meta + note + '</div>';
}

function stepHtml(sc, i) {
  const offen = !!sc.offen;
  const farbe = sc.farbe || 'var(--blau)';
  const badge = sc.rolle ?
    '<span class="badge ' + (sc.rolleStil ? 'b-' + sc.rolleStil : 'b-blue') + '">' + esc(sc.rolle) + '</span>'
    : '';
  let body = '';
  (sc.elemente || []).forEach(function (el) { body += elementHtml(el); });
  return '<div class="step">' +
    '<div class="step-hd" data-step-toggle="' + i + '">' +
    '<div class="step-num" style="background:' + esc(farbe) + '">' + (sc.nr != null ? esc(sc.nr) : (i + 1)) + '</div>' +
    '<div class="step-title">' + esc(sc.titel || '') + '</div>' + badge +
    '<div class="chev ' + (offen ? 'open' : '') + '" data-chev="' + i + '">v</div></div>' +
    '<div class="step-body ' + (offen ? 'open' : '') + '" data-body="' + i + '">' + body + '</div></div>';
}

function elementHtml(el) {
  if (typeof el.render === 'function') {
    try { return el.render(el) || ''; }
    catch (e) { return '<div class="box bx-orange"><div class="lbl">Modul</div>Modul konnte nicht gerendert werden: ' + esc(e.message || e) + '</div>'; }
  }
  switch (el.typ) {
    case 'info':
      return '<div class="box ' + (STIL_BOX[el.stil] || 'bx-blue') + '">' +
        (el.titel ? '<div class="lbl">' + esc(el.titel) + '</div>' : '') + esc(el.text) + '</div>';
    case 'split':
      return '<div class="split">' + (el.zellen || []).map(function (z) {
        return '<div class="sp-cell sp-' + (z.stil === 'gruen' ? 'green' : z.stil === 'rot' ? 'red' : z.stil === 'orange' ? 'orange' : 'blue') + '">' +
          (z.titel ? '<strong>' + esc(z.titel) + '</strong>' : '') + esc(z.text) + '</div>';
      }).join('') + '</div>';
    case 'sec':
      return '<div class="sec">' + esc(el.text) + '</div>';
    case 'checkliste': {
      const g = el.stil === 'gruen' ? ' chk-g' : '';
      const rows = (el.items || []).map(function (it) {
        return '<div class="chk' + g + '" data-check="' + esc(el.id) + '"><div class="cb"></div><span>' + esc(it) + '</span></div>';
      }).join('');
      return '<div class="checklist" data-checklist="' + esc(el.id) + '">' + rows + '</div>';
    }
    case 'auswahl': {
      const opts = (el.optionen || []).map(function (o) {
        return '<button class="rbtn" data-radio="' + esc(el.id) + '" data-wert="' + esc(o.wert) + '">' + esc(o.text) + '</button>';
      }).join('');
      return '<div class="form-row">' + (el.label ? '<label>' + esc(el.label) + '</label>' : '') +
        '<div class="radio-group">' + opts + '</div></div>';
    }
    case 'zahl': {
      const einh = (el.einheiten || []).map(function (u, k) {
        return '<button class="unit-btn' + (k === 0 ? ' sel' : '') + '" data-unit="' + esc(el.id) + '" data-wert="' + esc(u) + '">' + esc(u) + '</button>';
      }).join('');
      return '<div class="form-row">' + (el.label ? '<label>' + esc(el.label) + '</label>' : '') +
        '<input type="number" data-num="' + esc(el.id) + '"' +
        (el.min != null ? ' min="' + esc(el.min) + '"' : '') +
        (el.max != null ? ' max="' + esc(el.max) + '"' : '') +
        ' placeholder="' + esc(el.platzhalter || '-') + '">' + einh + '</div>';
    }
    case 'tabelle': {
      const kopf = (el.kopf || []).map(function (h, k) {
        return '<th' + (el.breiten && el.breiten[k] ? ' style="width:' + esc(el.breiten[k]) + '"' : '') + '>' + esc(h) + '</th>';
      }).join('');
      const zeilen = (el.zeilen || []).map(function (z) {
        const cls = z.stil ? ' class="row-' + (z.stil === 'gruen' ? 'green' : 'gray') + '"' : '';
        const cells = (z.zellen || z).map(function (c, k) {
          return '<td' + (k === 0 ? ' class="fw"' : '') + '>' + esc(c) + '</td>';
        }).join('');
        return '<tr' + cls + '>' + cells + '</tr>';
      }).join('');
      return '<table class="tbl ' + (STIL_TBL[el.stil] || 'tbl-blue') + '">' +
        (kopf ? '<thead><tr>' + kopf + '</tr></thead>' : '') + '<tbody>' + zeilen + '</tbody></table>';
    }
    case 'liste':
      return '<ul class="ul">' + (el.items || []).map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>';
    case 'icd': {
      const rows = (el.items || []).map(function (it) {
        return '<div class="chk chk-g" data-icd="' + esc(el.id) + '" data-code="' + esc(it.code) + '"><div class="cb"></div>' +
          '<span><strong>' + esc(it.code) + '</strong> &nbsp;-&nbsp; ' + esc(it.text) + '</span></div>';
      }).join('');
      return '<div class="sec">Leistungsdiagnose (LD) - ICD-10 auswählen:</div>' +
        '<div class="box bx-blue"><div class="lbl">Hinweis</div>Auswahl durch Anklicken (Mehrfachauswahl möglich). Codes werden in den Baustein übernommen.</div>' +
        '<div class="checklist" data-icdlist="' + esc(el.id) + '">' + rows + '</div>';
    }
    case 'text':
      return '<div class="form-row">' + (el.label ? '<label>' + esc(el.label) + '</label>' : '') +
        '<input type="text" data-text="' + esc(el.id) + '" placeholder="' + esc(el.platzhalter || '') + '" style="flex:1;min-width:180px"></div>';
    case 'textarea':
      return '<div class="form-row" style="align-items:stretch;display:block">' +
        (el.label ? '<label style="display:block;margin-bottom:4px">' + esc(el.label) + '</label>' : '') +
        '<textarea data-text="' + esc(el.id) + '" placeholder="' + esc(el.platzhalter || '') + '" ' +
        'style="width:100%;min-height:' + esc(el.hoehe || '90px') + ';border:1px solid var(--linie);border-radius:6px;padding:8px 10px;font:inherit;resize:vertical"></textarea></div>';
    case 'html':
      return el.html || '';
    default:
      return '';
  }
}

/* ---- 8. Interaktion / State ---------------------------------------- */
function wireViewer(def) {
  const v = $('#pcm-workspace') || $('#pcm-viewer');

  // Schritte auf-/zuklappen
  v.querySelectorAll('[data-step-toggle]').forEach(function (hd) {
    hd.addEventListener('click', function () {
      const key = hd.getAttribute('data-step-toggle');
      const body = v.querySelector('[data-body="' + key + '"]');
      const chev = v.querySelector('[data-chev="' + key + '"]');
      const open = body.classList.toggle('open');
      if (chev) chev.classList.toggle('open', open);
    });
  });

  // Checklisten (rot = Red Flags / blau-grn = sonstige)
  v.querySelectorAll('[data-check]').forEach(function (row) {
    row.addEventListener('click', function () {
      row.querySelector('.cb').classList.toggle('on');
      const id = row.getAttribute('data-check');
      state[id] = collectChecks(v, 'data-checklist', id);
      refresh();
    });
  });

  // ICD-Auswahl
  v.querySelectorAll('[data-icd]').forEach(function (row) {
    row.addEventListener('click', function () {
      row.querySelector('.cb').classList.toggle('on');
      const id = row.getAttribute('data-icd');
      state[id] = collectIcd(v, id);
      refresh();
    });
  });

  // Auswahl (Radio-Buttons)
  v.querySelectorAll('[data-radio]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const id = btn.getAttribute('data-radio');
      const wert = btn.getAttribute('data-wert');
      v.querySelectorAll('[data-radio="' + id + '"]').forEach(function (b) {
        b.classList.toggle('sel', b === btn);
      });
      state[id] = wert;
      refresh();
    });
  });

  // Zahl + Einheit
  v.querySelectorAll('[data-num]').forEach(function (inp) {
    inp.addEventListener('input', function () {
      const id = inp.getAttribute('data-num');
      state[id] = state[id] || { wert: '', einheit: '' };
      state[id].wert = inp.value;
      refresh();
    });
  });
  v.querySelectorAll('[data-unit]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const id = btn.getAttribute('data-unit');
      const wert = btn.getAttribute('data-wert');
      v.querySelectorAll('[data-unit="' + id + '"]').forEach(function (b) {
        b.classList.toggle('sel', b === btn);
      });
      state[id] = state[id] || { wert: '', einheit: '' };
      state[id].einheit = wert;
      refresh();
    });
  });

  // Freitext
  v.querySelectorAll('[data-text]').forEach(function (inp) {
    inp.addEventListener('input', function () {
      state[inp.getAttribute('data-text')] = inp.value;
      refresh();
    });
  });

  // Erweiterbare Spezialmodule aus Add-ons
  (def.schritte || []).forEach(function (schritt) {
    (schritt.elemente || []).forEach(function (el) {
      if (typeof el.wire !== 'function') return;
      try {
        el.wire({
          root: v,
          state: state,
          setState: function (patch) {
            if (typeof patch === 'function') patch(state);
            else Object.assign(state, patch || {});
            refresh();
          },
          refresh: refresh,
          esc: esc
        });
      } catch (e) {
        bootErrors.push('Modul-Fehler (' + (def.id || '?') + '): ' + (e.message || e));
        renderErrors();
      }
    });
  });

  // Baustein erzeugen + kopieren (fehlt bei reinen Info-Seiten)
  const genBtn = $('#pcm-gen');
  if (genBtn) genBtn.addEventListener('click', generateBaustein);
  const copyBtn = $('#pcm-copy');
  if (copyBtn) copyBtn.addEventListener('click', copyBaustein);
}

function collectChecks(v, attr, id) {
  const out = [];
  v.querySelectorAll('[' + attr + '="' + id + '"] .chk').forEach(function (row) {
    if (row.querySelector('.cb').classList.contains('on')) {
      out.push(row.querySelector('span').textContent.trim());
    }
  });
  return out;
}
function collectIcd(v, id) {
  const out = [];
  v.querySelectorAll('[data-icd="' + id + '"]').forEach(function (row) {
    if (row.querySelector('.cb').classList.contains('on')) out.push(row.getAttribute('data-code'));
  });
  return out;
}

function isScoreDefinition(def) {
  return !!def && (sopBereich(def) === 'Scores' || def.kategorie === 'Scores');
}

function appendSentence(base, sentence) {
  base = String(base || '').trim();
  sentence = String(sentence || '').trim();
  if (!sentence) return base;
  if (base && !/[.!?]$/.test(base)) base += '.';
  if (sentence && !/[.!?]$/.test(sentence)) sentence += '.';
  return (base ? base + ' ' : '') + sentence;
}

function scoreEinordnung(def, st) {
  if (!isScoreDefinition(def) || typeof def.auswertung !== 'function') return '';
  let res;
  try { res = def.auswertung(st) || {}; }
  catch (e) { return ''; }
  const teile = [];
  (res.meldungen || []).forEach(function (m) {
    const titel = String(m.titel || '').trim();
    const text = String(m.text || '').trim();
    if (text) teile.push(text);
    else if (titel) teile.push(titel);
  });
  return teile.join(' | ');
}

function ohneDoppelteEinordnung(einordnung, befund) {
  einordnung = String(einordnung || '').trim();
  befund = String(befund || '').trim();
  if (!einordnung || !befund) return einordnung;
  return einordnung
    .match(/[^.!?]+[.!?]*/g)
    .filter(Boolean)
    .filter(function (satz) {
      const sauber = satz.replace(/[.!?]+$/, '').trim();
      return sauber && befund.indexOf(sauber) === -1;
    })
    .join(' ');
}

function optionText(el, wert) {
  const opt = (el.optionen || []).find(function (o) { return String(o.wert) === String(wert); });
  return opt ? opt.text : wert;
}

function labelText(el) {
  return String(el.label || el.titel || el.id || '').replace(/:\s*$/, '').trim();
}

function scoreAntwortDetails(def, st) {
  if (!isScoreDefinition(def)) return '';
  const details = [];
  (def.schritte || []).forEach(function (schritt) {
    (schritt.elemente || []).forEach(function (el) {
      if (!el.id) return;
      if (el.typ === 'auswahl') {
        const wert = st[el.id];
        if (wert == null || wert === '') return;
        details.push(labelText(el) + ': ' + optionText(el, wert));
      } else if (el.typ === 'zahl') {
        const z = st[el.id] || {};
        if (z.wert == null || z.wert === '') return;
        details.push(labelText(el) + ': ' + z.wert + (z.einheit ? ' ' + z.einheit : ''));
      }
    });
  });
  return details.join('; ');
}

/* Live-Auswertung: Red-Flag-Banner + Hinweis-Panel */
function refresh() {
  if (!aktiveSOP) return;
  let res = { redflag: false, meldungen: [] };
  if (typeof aktiveSOP.auswertung === 'function') {
    try { res = aktiveSOP.auswertung(state) || res; }
    catch (e) { res = { redflag: false, meldungen: [{ stil: 'orange', titel: 'Auswertungsfehler', text: String(e.message || e) }] }; }
  }
  const banner = $('#pcm-rf-banner');
  banner.classList.toggle('hidden', !res.redflag);
  if (res.redflag && res.bannerText) $('#pcm-rf-text').textContent = res.bannerText;

  const meld = $('#pcm-meld');
  meld.innerHTML = (res.meldungen || []).map(function (m) {
    return '<div class="box ' + (STIL_BOX[m.stil] || 'bx-blue') + '">' +
      (m.titel ? '<div class="lbl">' + esc(m.titel) + '</div>' : '') + esc(m.text) + '</div>';
  }).join('');

  // PVS-Baustein immer direkt erzeugen und live aktualisieren.
  generateBaustein(true);
}

/* ---- 9. PVS-Textbaustein (generisch, über das PVS-Template) --------- */
function rollenText(text) {
  const rolle = aktiveRolle || 'PCM';
  return String(text == null ? '' : text)
    .replace(/PCM\/VERAH\/MFA-Basisberatung/g, 'Basisberatung durch ' + rolle)
    .replace(/PCM\/VERAH\/MFA-Beratung/g, 'Beratung durch ' + rolle)
    .replace(/PCM\/VERAH\/MFA-Kontakt/g, rolle + '-Kontakt')
    .replace(/PCM\/VERAH\/MFA-Eigenmanagement beendet/g, 'Eigenständiges Vorgehen durch ' + rolle + ' beendet')
    .replace(/PCM\/VERAH\/MFA-Eigenmanagement/g, 'Eigenmanagement durch ' + rolle)
    .replace(/durch PCM\/VERAH\/MFA/g, 'durch ' + rolle)
    .replace(/PCM\/VERAH\/MFA/g, rolle)
    .replace(/PCM-Basisberatung/g, 'Basisberatung durch ' + rolle)
    .replace(/PCM-Beratung/g, 'Beratung durch ' + rolle)
    .replace(/PCM-Kontakt/g, rolle + '-Kontakt')
    .replace(/PCM-Verlaufskontrolle/g, 'Verlaufskontrolle durch ' + rolle)
    .replace(/PCM-Daten/g, rolle + '-Daten')
    .replace(/PCM-Eigenmanagement/g, 'Eigenmanagement durch ' + rolle);
}

function rollenSections(sections) {
  const out = {};
  Object.keys(sections || {}).forEach(function (key) {
    out[key] = key === 'LD' ? sections[key] : rollenText(sections[key]);
  });
  if (out.AN && String(out.AN).indexOf(aktiveRolle || 'PCM') === -1) {
    out.AN = 'Durchgeführt durch ' + (aktiveRolle || 'PCM') + '. ' + out.AN;
  }
  return out;
}

function applyPvsTemplate(sections) {
  const tpl = PCM._pvs() || { abschnitte: [{ key: 'AN', label: 'AN' }, { key: 'BE', label: 'BE' }, { key: 'TH', label: 'TH' }, { key: 'LD', label: 'LD' }], trennzeichen: '\n', leereWeglassen: true };
  const out = [];
  (tpl.abschnitte || []).forEach(function (ab) {
    let val = sections[ab.key];
    if (val == null) { if (!tpl.leereWeglassen) { out.push(ab.label); out.push(''); } return; }
    val = String(val).trim();
    if (!val) { if (!tpl.leereWeglassen) { out.push(ab.label); out.push(''); } return; }
    out.push(ab.label);
    out.push(val);
  });
  return out.join(tpl.trennzeichen || '\n');
}

function generateBaustein(silent) {
  if (!aktiveSOP || typeof aktiveSOP.baustein !== 'function') return;
  let sections;
  try { sections = aktiveSOP.baustein(state) || {}; }
  catch (e) {
    $('#pcm-out-text').value = 'Fehler bei der Baustein-Erzeugung: ' + (e.message || e);
    $('#pcm-out').classList.remove('hidden');
    return;
  }
  const einordnung = ohneDoppelteEinordnung(scoreEinordnung(aktiveSOP, state), sections.BE);
  if (einordnung) sections.BE = appendSentence(sections.BE, 'Einordnung: ' + einordnung);
  const antwortDetails = scoreAntwortDetails(aktiveSOP, state);
  if (antwortDetails) sections.BE = appendSentence(sections.BE, 'Einzelantworten: ' + antwortDetails);
  sections = rollenSections(sections);
  $('#pcm-out-text').value = applyPvsTemplate(sections);
  $('#pcm-out').classList.remove('hidden');
  if (silent !== true) $('#pcm-out').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function copyBaustein() {
  const ta = $('#pcm-out-text');
  if (!ta || !ta.value) return;
  ta.removeAttribute('readonly');
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.setAttribute('readonly', '');
  if (!ok && navigator.clipboard) { navigator.clipboard.writeText(ta.value).catch(function () {}); }
  const btn = $('#pcm-copy');
  btn.classList.add('ok');
  btn.innerHTML = '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Kopiert!';
  setTimeout(function () {
    btn.classList.remove('ok');
    btn.innerHTML = '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Alles kopieren';
  }, 2200);
}
